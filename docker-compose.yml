services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agent-dev

  migrate:
    profiles:
      - setup
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    command: ["python", "scripts/init_db.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agent-dev

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-dev

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.dev
    restart: unless-stopped
    env_file:
      - frontend/.env.local
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - agent-dev

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  agent-dev:
    driver: bridge
